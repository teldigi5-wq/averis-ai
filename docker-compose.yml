services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: averis
      POSTGRES_USER: averis
      POSTGRES_PASSWORD: averis
    ports:
      - "5432:5432"
    volumes:
      - averis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U averis -d averis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - averis_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: averis
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - averis_minio:/data

volumes:
  averis_pg:
  averis_redis:
  averis_minio:
