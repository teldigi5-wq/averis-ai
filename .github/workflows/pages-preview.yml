name: Averis Static Web Certification

on:
  push:
    branches:
      - feat/professional-ui-brand-v1
    paths:
      - "apps/web/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "averis-static-web-certification"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_API_URL: "https://averis-api-beta-db36dd7d.azurewebsites.net"
      NEXT_PUBLIC_SUPABASE_URL: "https://lydepiaatemwpremgekt.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_hrvA30mwTq5Yhjfq4SXaoA_TYcCUE0j"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify static routes
        run: |
          test -f out/index.html
          test -f out/multi-source/index.html
          test -f out/privacy/index.html

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: averis-static-web
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7
