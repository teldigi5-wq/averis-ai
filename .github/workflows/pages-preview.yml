name: Averis GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "averis-github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_API_URL: "https://averis-api-beta-db36dd7d.azurewebsites.net"
      NEXT_PUBLIC_SUPABASE_URL: "https://lydepiaatemwpremgekt.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_hrvA30mwTq5Yhjfq4SXaoA_TYcCUE0j"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify static routes
        run: |
          test -f out/index.html
          test -f out/multi-source/index.html
          test -f out/revision/index.html
          test -f out/refine/index.html
          test -f out/privacy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
