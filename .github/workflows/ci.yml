name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/security/check_tracked_secrets.py
      - run: bash scripts/vercel/test_ignored_build.sh

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q app
      - run: pytest -q

  api-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build --tag averis-api-ci .
      - name: Smoke test API container
        run: |
          docker run --rm -d --name averis-api-ci -p 8000:8080 -e PORT=8080 averis-api-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/averis-health.json; then
              cat /tmp/averis-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs averis-api-ci
          exit 1
      - name: Stop API container
        if: always()
        run: docker rm -f averis-api-ci >/dev/null 2>&1 || true

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  web-static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_API_URL: "https://averis-api-beta-db36dd7d.azurewebsites.net"
      NEXT_PUBLIC_SUPABASE_URL: "https://lydepiaatemwpremgekt.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_hrvA30mwTq5Yhjfq4SXaoA_TYcCUE0j"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Verify certified beta and Averis 2.0 static routes
        run: |
          test -f out/index.html
          test -f out/multi-source/index.html
          test -f out/privacy/index.html
          test -f out/v2/index.html
          test -f out/v2/new-review/index.html
          test -f out/v2/documents/index.html
          test -f out/v2/sources/index.html
          test -f out/v2/citations/index.html
          test -f out/v2/history/index.html
          test -f out/v2/settings/index.html
          test -f out/v2/help/index.html
