name: AI Runtime Certification

on:
  push:
    branches:
      - feat/ai-runtime-certification-v9
  pull_request:
    paths:
      - ".github/workflows/ai-runtime-certification.yml"
      - "services/api/app/ai/**"
      - "services/api/app/services/evidence_calibration.py"
      - "services/api/app/services/detector_benchmark.py"
      - "services/api/app/services/revision_metrics.py"
      - "services/api/scripts/certify_ollama.py"
      - "services/api/scripts/benchmark_semantic.py"
      - "services/api/scripts/prepare_paws_wiki_benchmark.py"
      - "services/api/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-embedding-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyarrow>=17,<23"
      - name: Install Ollama
        run: |
          set -o pipefail
          curl -fsSL https://ollama.com/install.sh | sh
      - name: Ensure Ollama is reachable
        run: |
          if ! curl --fail --silent http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
          fi
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json; then
              cat /tmp/ollama-tags.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log 2>/dev/null || true
          exit 1
      - name: Pull open-source embedding model
        run: ollama pull nomic-embed-text
      - name: Certify embedding runtime
        run: |
          set -o pipefail
          mkdir -p ../../artifacts
          python -m scripts.certify_ollama \
            --base-url http://127.0.0.1:11434 \
            --embedding-model nomic-embed-text \
            --timeout 45 \
            | tee ../../artifacts/ollama-runtime-certification.json
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = Path("../../artifacts/ollama-runtime-certification.json")
          payload = json.loads(artifact.read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("runtime certification artifact did not report ok=true")
          print("runtime certification artifact validated: ok=true")
          PY
      - name: Download pinned PAWS-Wiki labeled benchmark
        run: |
          set -o pipefail
          mkdir -p /tmp/paws-wiki ../../artifacts/paws
          PAWS_REVISION=161ece9501cf0a11f3e48bd356eaa82de46d6a09
          curl --fail --location --silent --show-error --retry 3 \
            "https://huggingface.co/datasets/google-research-datasets/paws/resolve/${PAWS_REVISION}/labeled_final/validation-00000-of-00001.parquet?download=true" \
            -o /tmp/paws-wiki/validation.parquet
          curl --fail --location --silent --show-error --retry 3 \
            "https://huggingface.co/datasets/google-research-datasets/paws/resolve/${PAWS_REVISION}/labeled_final/test-00000-of-00001.parquet?download=true" \
            -o /tmp/paws-wiki/test.parquet
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/google-research-datasets/paws/master/LICENSE \
            -o ../../artifacts/paws/LICENSE.txt
          sha256sum /tmp/paws-wiki/validation.parquet /tmp/paws-wiki/test.parquet \
            | tee ../../artifacts/paws/source-files.sha256
      - name: Prepare deterministic PAWS validation and test samples
        run: |
          set -o pipefail
          python -m scripts.prepare_paws_wiki_benchmark \
            /tmp/paws-wiki/validation.parquet \
            /tmp/paws-wiki/test.parquet \
            ../../artifacts/paws \
            --per-class 100 \
            --seed averis-paws-wiki-v1 \
            | tee ../../artifacts/paws-preparation.json
      - name: Run disjoint held-out semantic benchmark
        run: |
          set -o pipefail
          python -m scripts.benchmark_semantic \
            ../../artifacts/paws/calibration.jsonl \
            ../../artifacts/paws/holdout.jsonl \
            --base-url http://127.0.0.1:11434 \
            --embedding-model nomic-embed-text \
            --timeout 60 \
            --min-class-size 100 \
            --batch-size 32 \
            | tee ../../artifacts/paws-semantic-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = Path("../../artifacts/paws-semantic-benchmark.json")
          payload = json.loads(artifact.read_text(encoding="utf-8"))
          if payload.get("locked_threshold") is None:
              raise SystemExit("semantic benchmark did not produce a locked calibration threshold")
          if payload.get("calibration_dataset", {}).get("samples") != 200:
              raise SystemExit("unexpected calibration sample count")
          if payload.get("holdout_dataset", {}).get("samples") != 200:
              raise SystemExit("unexpected holdout sample count")
          print("held-out benchmark artifact validated")
          PY
      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log 2>/dev/null || true
      - name: Upload AI certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-certification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
