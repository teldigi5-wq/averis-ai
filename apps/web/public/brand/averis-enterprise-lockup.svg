<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" role="img" aria-labelledby="title desc">
  <title id="title">Averis</title>
  <desc id="desc">Averis Academic Integrity Intelligence</desc>
  <defs>
    <linearGradient id="outer" x1="20" y1="16" x2="170" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7FFFF"/>
      <stop offset="0.3" stop-color="#31E2F3"/>
      <stop offset="0.68" stop-color="#1A95FF"/>
      <stop offset="1" stop-color="#1357E7"/>
    </linearGradient>
    <linearGradient id="inner" x1="154" y1="52" x2="60" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2398FF"/>
      <stop offset="0.48" stop-color="#0B5DCE"/>
      <stop offset="1" stop-color="#29E5EE"/>
    </linearGradient>
    <linearGradient id="word" x1="220" y1="28" x2="690" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#F5FBFF"/>
      <stop offset="1" stop-color="#BBD9F8"/>
    </linearGradient>
    <linearGradient id="tag" x1="222" y1="0" x2="690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9EEAFF"/>
      <stop offset="0.48" stop-color="#D9F5FF"/>
      <stop offset="1" stop-color="#85C8FF"/>
    </linearGradient>
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#008FEA" flood-opacity="0.18"/>
    </filter>
    <filter id="wordShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#061A38" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(8 4)" filter="url(#markShadow)">
    <path d="M7 150 56 34c5.6-13.3 16.9-20 29-20 12.7 0 24 7.5 29.5 21.3L161 143l-27.3 10.2-35.9-84c-3.2-7.6-7.5-11.4-12.7-11.4-5.4 0-9.6 3.8-12.9 11.5L36.4 153Z" fill="url(#outer)"/>
    <path d="M49.5 127.7c26.6-7.6 43.1-29.3 50.6-55.5 4.4-15.3 10-22.7 17-22.2 6.5.5 13.2 7.6 20.2 21.5l18.8 35.5c-20.3-12-37.9-9-50.4 12.2-12 20.4-30.9 34.2-57.2 42Z" fill="url(#inner)"/>
    <path d="m67.1 119.1 7.8 16 16 7.8-16 7.8-7.8 16-7.8-16-16-7.8 16-7.8Z" fill="#8BFBFF" filter="url(#sparkGlow)"/>
  </g>

  <g transform="translate(194 22)">
    <text x="0" y="83" fill="url(#word)" filter="url(#wordShadow)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="98" font-weight="780" letter-spacing="-6.5">Averis</text>
    <circle cx="371" cy="4" r="10.5" fill="#2DE0EE" filter="url(#sparkGlow)"/>
    <path d="M4 107H472" stroke="#71CFF4" stroke-opacity="0.13"/>
    <text x="4" y="131" fill="url(#tag)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="700" letter-spacing="5.6">ACADEMIC INTEGRITY INTELLIGENCE</text>
